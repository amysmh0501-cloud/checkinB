<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>線上打卡系統</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }
    h2 { text-align: center; color: #1a1a1a; margin-bottom: 20px; font-weight: 600; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 14px; color: #666; margin-bottom: 6px; }
    /* iOS input 字體需至少 16px 以防自動 Zoom 入 */
    input, select, textarea {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
      -webkit-appearance: none;
    }
    .btn-group { display: flex; gap: 12px; margin-top: 20px; }
    button {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-in { background-color: #10b981; }
    .btn-in:active { background-color: #059669; }
    .btn-out { background-color: #ef4444; }
    .btn-out:active { background-color: #dc2626; }
    button:disabled { background-color: #9ca3af; cursor: not-allowed; }
    #status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      display: none;
    }
    .success { background-color: #d1fae5; color: #065f46; display: block !important; }
    .error { background-color: #fee2e2; color: #991b1b; display: block !important; }
    .info { background-color: #e0f2fe; color: #075985; display: block !important; }
  </style>
</head>
<body>

<div class="card">
  <h2>⏰ 企業員工打卡</h2>
  
  <div class="form-group">
    <label for="employeeId">員工編號</label>
    <input type="text" id="employeeId" placeholder="例如：EMP-001" required>
  </div>

  <div class="form-group">
    <label for="employeeName">員工姓名</label>
    <input type="text" id="employeeName" placeholder="例如：張小明" required>
  </div>

  <div class="form-group">
    <label for="notes">備註（可填寫）</label>
    <textarea id="notes" rows="2" placeholder="如：外勤、遲到原因等..."></textarea>
  </div>

  <div class="btn-group">
    <button class="btn-in" onclick="clockIn('上班')">上班打卡</button>
    <button class="btn-out" onclick="clockIn('下班')">下班打卡</button>
  </div>

  <div id="status"></div>
</div>

<script>
  // ⚠️ 請替換為您 GAS 部署後獲得的 Web App URL
  const GAS_URL = "https://script.google.com/macros/s/AKfycbxEna-6JQquxNczx0sB3sGa4ECzEOWi-ppd4J22obFD3XAPg_WZTIqa4IRTPUC_2KRI4A/exec";

  function showStatus(msg, type) {
    const el = document.getElementById("status");
    el.innerText = msg;
    el.className = type;
  }

  // 取得 GPS 位置（針對 iOS Safari 特別優化）
  function getGPSLocation() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) {
        resolve("不支援 GPS 定位");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude.toFixed(5);
          const lng = pos.coords.longitude.toFixed(5);
          resolve(`${lat}, ${lng}`);
        },
        (err) => {
          console.warn("GPS 取得失敗:", err.message);
          resolve("定位未授權/失敗");
        },
        { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 }
      );
    });
  }

  async function clockIn(type) {
    const empId = document.getElementById("employeeId").value.trim();
    const name = document.getElementById("employeeName").value.trim();
    const notes = document.getElementById("notes").value.trim();

    if (!empId || !name) {
      showStatus("請輸入員工編號與姓名！", "error");
      return;
    }

    // 禁用按鈕防止重複送出
    const buttons = document.querySelectorAll("button");
    buttons.forEach(b => b.disabled = true);
    showStatus("📍 正在取得位置與傳送打卡資料...", "info");

    const location = await getGPSLocation();
    const userAgent = navigator.userAgent;

    const payload = {
      employeeId: empId,
      name: name,
      type: type,
      location: location,
      device: userAgent,
      notes: notes
    };

    try {
      // 使用 fetch 傳送 POST 請求至 GAS
      const response = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        redirect: "follow" // GAS 重定向處理
      });

      const resData = await response.json();

      if (resData.result === "success") {
        showStatus(`✅ 打卡成功！時間：${resData.timestamp}`, "success");
      } else {
        showStatus(`❌ 打卡失敗：${resData.error || '未知錯誤'}`, "error");
      }
    } catch (err) {
      console.error(err);
      showStatus("❌ 網路連線或系統錯誤，請稍後重試。", "error");
    } finally {
      buttons.forEach(b => b.disabled = false);
    }
  }
</script>

</body>
</html>
